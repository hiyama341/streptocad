[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streptocad"
dynamic = ["version"]
description = "An open-source software toolbox supporting genome engineering workflows in streptomycetes"
authors = [{ name = "Technical University of Denmark, DTU" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["streptomyces", "crispr", "genome engineering", "primer design", "synthetic biology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11,<3.13"
# Library ranges start at the versions tested in uv.lock; the deployed app pins exact
# versions in requirements.txt.
#
# biopython >=1.82 is required for correctness, not just for security. Biopython 1.82
# corrected two entropy values in the SantaLucia & Hicks (2004) nearest-neighbour table
# (DNA_NN4): TA/AT -20.4 -> -21.3 and GG/CC -19.0 -> -19.9. Earlier releases overestimate
# primer melting temperatures by roughly 2.3 C, which makes pydna's primer_design stop one
# base short of the requested target_tm. teemi <1.0 pins biopython==1.80, so it holds that
# bug in place; teemi >=1.0.5 relaxes the pin and requires pydna >=5.5.
dependencies = [
  "biopython>=1.82,<2",
  "dnachisel>=3.2.11,<4",
  "nbconvert>=7.17.1",
  "nbformat>=5.10",
  "numpy>=2.1.1,<3",
  "pandas>=2.2.2,<3",
  "primer3-py>=2.0.3,<3",
  "pydna>=5.5.0,<6",
  "python-codon-tables>=0.1.12",
  "requests>=2.33.0,<3",
  "scipy>=1.14.1,<2",
  "teemi>=1.0.5,<2",
]

[project.urls]
Homepage = "https://streptocad.bioengineering.dtu.dk"
Repository = "https://github.com/hiyama341/streptocad"
Issues = "https://github.com/hiyama341/streptocad/issues"
Paper = "https://www.biorxiv.org/content/10.1101/2024.12.19.629370v1"

[tool.hatch.version]
path = "streptocad/__init__.py"

[tool.hatch.build]
exclude = ["streptocad/experimental/archive"]

[tool.hatch.build.targets.wheel]
packages = ["streptocad"]

[tool.hatch.build.targets.sdist]
# Keep notebooks, videos, the web app and test fixtures (~350 MB) out of the sdist.
only-include = ["streptocad", "README.md", "LICENSE", "HISTORY.rst"]

[tool.uv]
# primer3-py 2.0.3 ships no arm64 macOS wheel, so Apple Silicon builds it from source.
# Its Cython source uses the Python 2 `long` builtin, which Cython 3 removed.
build-constraint-dependencies = ["cython<3"]

# Ranges rather than exact pins, so security patches can be picked up by
# `uv lock --upgrade`. uv.lock still pins the exact resolved versions, so builds
# stay reproducible. Upper bounds stop an unattended jump to a new major.
[dependency-groups]
app = [
  "dash>=3.1.0,<4",
  "dash-bootstrap-components>=1.6.0,<2",
  "plotly>=5.24.1,<6",
]
dev = [
  "pytest>=8.3.3,<10",
  "pytest-cov>=4.1.0,<8",
  "ruff>=0.8.6,<1",
]
docs = [
  "mkdocs>=1.6.1,<2",
]
notebooks = [
  "ipykernel>=6.29.5,<7",
  "matplotlib>=3.9.2,<4",
  "nbclient>=0.10.0,<1",
  "nbconvert>=7.17.1,<8",
  "nbformat>=5.10.4,<6",
  "openpyxl>=3.1.5,<4",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
# Ruff spells these with hyphens. With underscores it rejects the whole file, so
# every `ruff` invocation failed with a TOML parse error instead of linting.
known-first-party = ["streptocad"]
force-sort-within-sections = true

[tool.pytest.ini_options]
# web_app is on the path the same way the deployed app has it (see the
# Dockerfile's PYTHONPATH), so the callback tests can import the Dash modules.
testpaths = ["tests"]
pythonpath = [".", "web_app"]
markers = [
  "integration: tests that call live external services such as the NEB Tm API",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
# Measured from the repo root so the paths in coverage.xml are repo-relative
# ("web_app/callbacks/workflow_1.py"). Listing streptocad and web_app as two
# separate sources instead strips those prefixes, which Codecov cannot map back
# onto the tree. `uv run pytest --cov` needs no further arguments.
source = ["."]
omit = [
  "tests/*",
  "notebooks/*",
  "docs/*",
  ".venv/*",
  "setup.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
