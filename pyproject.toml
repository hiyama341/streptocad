[project]
name = "streptocad"
version = "1.0.0"
description = "An open-source software toolbox supporting genome engineering workflows in streptomycetes"
authors = [{ name = "Technical University of Denmark, DTU" }]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.11,<3.13"
dependencies = [
  "biopython==1.80",
  "dnachisel==3.2.11",
  "numpy==2.1.1",
  "pandas==2.2.2",
  "primer3-py==2.0.3",
  "pydna==5.2.0",
  "python-codon-tables==0.1.12",
  "requests==2.32.4",
  "scipy==1.14.1",
  "teemi==0.3.4",
]

[tool.uv]
package = false

[dependency-groups]
app = [
  "dash==3.1.0",
  "dash-bootstrap-components==1.6.0",
  "plotly==5.24.1",
]
dev = [
  "pytest==8.3.3",
  "pytest-cov==4.1.0",
  "ruff==0.8.6",
]
docs = [
  "mkdocs==1.6.1",
]
notebooks = [
  "ipykernel==6.29.5",
  "matplotlib==3.9.2",
  "nbclient==0.10.0",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
  "openpyxl==3.1.5",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["streptocad"]
force_sort_within_sections = true

[tool.pytest.ini_options]
# web_app is on the path the same way the deployed app has it (see the
# Dockerfile's PYTHONPATH), so the callback tests can import the Dash modules.
testpaths = ["tests"]
pythonpath = [".", "web_app"]
markers = [
  "integration: tests that call live external services such as the NEB Tm API",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
# Measured from the repo root so the paths in coverage.xml are repo-relative
# ("web_app/callbacks/workflow_1.py"). Listing streptocad and web_app as two
# separate sources instead strips those prefixes, which Codecov cannot map back
# onto the tree. `uv run pytest --cov` needs no further arguments.
source = ["."]
omit = [
  "tests/*",
  "notebooks/*",
  "docs/*",
  ".venv/*",
  "setup.py",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
