[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "streptocad"
dynamic = ["version"]
description = "An open-source software toolbox supporting genome engineering workflows in streptomycetes"
authors = [{ name = "Technical University of Denmark, DTU" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["streptomyces", "crispr", "genome engineering", "primer design", "synthetic biology"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11,<3.13"
# Library ranges start at the versions tested in uv.lock; the deployed app pins exact
# versions in requirements.txt. teemi itself pins biopython and pydna to these versions.
dependencies = [
  "biopython==1.80",
  "dnachisel>=3.2.11,<4",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "numpy>=2.1.1,<3",
  "pandas>=2.2.2,<3",
  "primer3-py>=2.0.3,<3",
  "pydna==5.2.0",
  "python-codon-tables>=0.1.12",
  "requests>=2.32.4,<3",
  "scipy>=1.14.1,<2",
  "teemi>=0.3.4,<0.4",
]

[project.urls]
Homepage = "https://streptocad.bioengineering.dtu.dk"
Repository = "https://github.com/hiyama341/streptocad"
Issues = "https://github.com/hiyama341/streptocad/issues"
Paper = "https://www.biorxiv.org/content/10.1101/2024.12.19.629370v1"

[tool.hatch.version]
path = "streptocad/__init__.py"

[tool.hatch.build]
exclude = ["streptocad/experimental/archive"]

[tool.hatch.build.targets.wheel]
packages = ["streptocad"]

[tool.hatch.build.targets.sdist]
# Keep notebooks, videos, the web app and test fixtures (~350 MB) out of the sdist.
only-include = ["streptocad", "README.md", "LICENSE", "HISTORY.rst"]

[tool.uv]
# primer3-py 2.0.3 ships no arm64 macOS wheel, so Apple Silicon builds it from source.
# Its Cython source uses the Python 2 `long` builtin, which Cython 3 removed.
build-constraint-dependencies = ["cython<3"]

[dependency-groups]
app = [
  "dash==3.1.0",
  "dash-bootstrap-components==1.6.0",
  "plotly==5.24.1",
]
dev = [
  "pytest==8.3.3",
  "pytest-cov==4.1.0",
  "ruff==0.8.6",
]
docs = [
  "mkdocs==1.6.1",
]
notebooks = [
  "ipykernel==6.29.5",
  "matplotlib==3.9.2",
  "nbclient==0.10.0",
  "nbconvert==7.16.4",
  "nbformat==5.10.4",
  "openpyxl==3.1.5",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["streptocad"]
force_sort_within_sections = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that call live external services such as the NEB Tm API",
]
addopts = "-m 'not integration'"
