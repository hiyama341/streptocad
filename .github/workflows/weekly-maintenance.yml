name: Weekly Maintenance

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    name: Full maintenance checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install all dependency groups
        run: uv sync --frozen --all-groups

      - name: Run deterministic tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest

      - name: Run live NEB integration tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          STREPTOCAD_RUN_NEB_INTEGRATION: "1"
        run: uv run pytest -o addopts="" -m integration

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t streptocad:${{ github.sha }} .
